<text x="286" y="120" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="379" y="142" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#18181b">Information Technology (IT)</text>
<rect x="509" y="96" width="224" height="122" rx="12" fill="#f1f1f3" stroke="#e4e4e7" stroke-width="1.5"/>
<circle cx="529" cy="116" r="12" fill="#e4e4e7"/>
<text x="529" y="120" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#52525b">3</text>
<text x="621" y="131" font-family="Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#18181b">Includes people, processes,</text>
<text x="621" y="153" font-family="Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#18181b">hardware, software,</text>
<rect x="752" y="96" width="224" height="122" rx="12" fill="#f1f1f3" stroke="#e4e4e7" stroke-width="1.5"/>
<circle cx="772" cy="116" r="12" fill="#e4e4e7"/>
<text x="772" y="120" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#52525b">4</text>
<text x="864" y="131" font-family="Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#18181b">Includes hardware, software,</text>
<text x="864" y="153" font-family="Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#18181b">networks, and</text>
<text x="24" y="270" font-family="Arial,sans-serif" font-size="16" fill="#52525b">Information Technology (IT) focuses on the physical tools and infrastructure (like hardware, software, and</text>
<text x="24" y="294" font-family="Arial,sans-serif" font-size="16" fill="#52525b">networks)</text>
<text x="976" y="344" font-family="Arial,sans-serif" font-size="12" text-anchor="end" fill="#52525b">IT_lecture_1_2026.pdf, p. 7</text>
