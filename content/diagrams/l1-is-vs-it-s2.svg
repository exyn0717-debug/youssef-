<text x="136" y="142" font-family="Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#18181b">Information Systems (IS)</text>
<rect x="266" y="96" width="224" height="122" rx="12" fill="#fdecef" stroke="#c8102e" stroke-width="3"/>
