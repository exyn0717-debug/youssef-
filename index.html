ental drift.","Solar input, the concentration of greenhouse gases, and the average global albedo.","Ocean currents, atmospheric pressure, and cloud cover.","Volcanic ash density, meteor impacts, and seismic activity."],"options_en":["Tidal forces, lunar eclipses, and continental drift.","Solar input, the concentration of greenhouse gases, and the average global albedo.","Ocean currents, atmospheric pressure, and cloud cover.","Volcanic ash density, meteor impacts, and seismic activity."],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"ما العوامل الثلاثة الأساسية التي تحدّد مناخ الأرض على المقاييس الزمنية الطويلة؟","options_ar":["قوى المد والجزر والخسوف القمري والانجراف القاري.","الإشعاع الشمسي الداخل وتركيز غازات الدفيئة ومتوسط الألبيدو العالمي.","تيارات المحيطات والضغط الجوي والغطاء السحابي.","كثافة الرماد البركاني واصطدامات النيازك والنشاط الزلزالي."]},{"id":"lms-nov-069","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"What is the field of study known as that looks back in time at ancient climate using materials that retained unique signatures?","prompt_en":"What is the field of study known as that looks back in time at ancient climate using materials that retained unique signatures?","options":["Meteorology","Paleoclimatology","Stratigraphy","Seismology"],"options_en":["Meteorology","Paleoclimatology","Stratigraphy","Seismology"],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"ما اسم مجال الدراسة الذي ينظر إلى الماضي لمعرفة المناخ القديم باستخدام مواد احتفظت ببصمات فريدة؟","options_ar":["علم الأرصاد الجوية","علم المناخ القديم (Paleoclimatology)","علم الطبقات (Stratigraphy)","علم الزلازل"]},{"id":"lms-nov-070","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"What are paleoclimate proxies?","prompt_en":"What are paleoclimate proxies?","options":["Direct thermometer measurements recorded over the last 200 years.","Materials that have retained a unique signature of ancient climate conditions, such as ice cores, tree rings, and pollen spores.","Artificial computer models simulating future climate scenarios.","Historical documents written exclusively during the Industrial Revolution."],"options_en":["Direct thermometer measurements recorded over the last 200 years.","Materials that have retained a unique signature of ancient climate conditions, such as ice cores, tree rings, and pollen spores.","Artificial computer models simulating future climate scenarios.","Historical documents written exclusively during the Industrial Revolution."],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"ما هي المؤشرات المناخية القديمة (Paleoclimate proxies)؟","options_ar":["قياسات مباشرة بميزان حرارة مسجّلة خلال الـ٢٠٠ سنة الماضية.","مواد احتفظت ببصمة فريدة لظروف المناخ القديم، مثل عينات الجليد وحلقات الأشجار وحبيبات اللقاح.","نماذج حاسوبية اصطناعية تحاكي سيناريوهات المناخ المستقبلية.","وثائق تاريخية كُتبت حصرًا في عصر الثورة الصناعية."]},{"id":"lms-nov-071","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"Prior to 2.6 million years ago during pre-Quaternary times, how did global temperatures and CO𝟐 levels generally compare to today?","prompt_en":"Prior to 2.6 million years ago during pre-Quaternary times, how did global temperatures and CO𝟐 levels generally compare to today?","options":["Temperatures and CO2 levels were both much lower than they are now.","Global temperatures were generally higher than they are now, typically correlated with atmospheric CO2 levels that were much greater than today.","Temperatures fluctuated wildly every 11 years with sunspot cycles.","CO2 levels were zero, and temperatures matched modern icehouse conditions."],"options_en":["Temperatures and CO2 levels were both much lower than they are now.","Global temperatures were generally higher than they are now, typically correlated with atmospheric CO2 levels that were much greater than today.","Temperatures fluctuated wildly every 11 years with sunspot cycles.","CO2 levels were zero, and temperatures matched modern icehouse conditions."],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"قبل ٢٫٦ مليون سنة خلال عصور ما قبل الرباعي، كيف كانت الحرارة العالمية ومستويات CO₂ عمومًا بالمقارنة مع اليوم؟","options_ar":["كانت الحرارة ومستويات CO₂ أدنى بكثير مما هي عليه الآن.","كانت الحرارة العالمية أعلى عمومًا مما هي عليه الآن، وترتبط عادةً بمستويات CO₂ جوية أكبر بكثير من اليوم.","كانت الحرارة تتذبذب بعنف كل ١١ سنة مع دورات الكلف الشمسي.","كانت مستويات CO₂ صفرًا، والحرارة مطابقة لظروف «بيت الجليد» الحديثة."]},{"id":"lms-nov-072","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"During the Early Eocene (52–48 million years ago), what were the atmospheric CO𝟐 concentrations and temperature conditions?","prompt_en":"During the Early Eocene (52–48 million years ago), what were the atmospheric CO𝟐 concentrations and temperature conditions?","options":["CO2 concentrations were below 100 ppm and temperatures were freezing.","CO2 concentrations were above 1,000 parts per million (ppm)—more than three times as high as modern preindustrial periods—and temperatures were higher.","CO2 levels matched modern preindustrial levels exactly.","CO2 levels reached 10,000 ppm, causing mass extinction."],"options_en":["CO2 concentrations were below 100 ppm and temperatures were freezing.","CO2 concentrations were above 1,000 parts per million (ppm)—more than three times as high as modern preindustrial periods—and temperatures were higher.","CO2 levels matched modern preindustrial levels exactly.","CO2 levels reached 10,000 ppm, causing mass extinction."],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"خلال الإيوسين المبكر (٥٢–٤٨ مليون سنة)، ماذا كانت تراكيز CO₂ الجوية وظروف الحرارة؟","options_ar":["كانت تراكيز CO₂ أقل من ١٠٠ جزء في المليون والحرارة متجمدة.","كانت تراكيز CO₂ أعلى من ١٠٠٠ جزء في المليون (ppm) — أكثر من ثلاثة أضعاف ما كانت عليه فترات ما قبل الصناعة الحديثة — وكانت الحرارة أعلى.","كانت مستويات CO₂ مطابقة تمامًا لمستويات ما قبل الصناعة الحديثة.","بلغت مستويات CO₂ ١٠٠٠٠ جزء في المليون فأحدثت انقراضًا جماعيًا."]},{"id":"lms-nov-073","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"What was the Paleocene-Eocene Thermal Maximum (PETM)?","prompt_en":"What was the Paleocene-Eocene Thermal Maximum (PETM)?","options":["A 100,000-year ice age caused by massive volcanic ash clouds.","A brief period at the boundary between the Paleocene and Eocene lasting only a few tens of thousands of years featuring a massive release of carbon into the atmosphere that precipitated a large increase in global temperatures.","A period when the Sun's output dropped by 50%.","The transition from the Holocene to the Pleistocene epoch."],"options_en":["A 100,000-year ice age caused by massive volcanic ash clouds.","A brief period at the boundary between the Paleocene and Eocene lasting only a few tens of thousands of years featuring a massive release of carbon into the atmosphere that precipitated a large increase in global temperatures.","A period when the Sun's output dropped by 50%.","The transition from the Holocene to the Pleistocene epoch."],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"ما هو الحد الأقصى الحراري الباليوسيني–الإيوسيني (PETM)؟","options_ar":["عصر جليدي دام ١٠٠٠٠٠ سنة سبّبته سحب رماد بركاني هائلة.","فترة قصيرة عند الحد الفاصل بين الباليوسين والإيوسين، دامت عشرات الآلاف من السنين فقط، شهدت إطلاقًا هائلًا للكربون في الغلاف الجوي أدّى إلى ارتفاع كبير في الحرارة العالمية.","فترة انخفض فيها إنتاج الشمس بنسبة ٥٠٪.","الانتقال من الهولوسين إلى البليستوسين."]},{"id":"lms-nov-074","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"What are stomata in plants, and how are they used in paleoclimatology?","prompt_en":"What are stomata in plants, and how are they used in paleoclimatology?","options":["Roots that absorb calcium carbonate; used to measure ocean salinity.","Pores in leaves that regulate the flow of CO2 and H2O; their density in ancient leaf fossils is used to recreate ancient atmospheric CO2 concentrations.","Growth rings in tree trunks; used to determine annual precipitation.","Bacterial shells in seafloor sediments; used to measure oxygen isotopes."],"options_en":["Roots that absorb calcium carbonate; used to measure ocean salinity.","Pores in leaves that regulate the flow of CO2 and H2O; their density in ancient leaf fossils is used to recreate ancient atmospheric CO2 concentrations.","Growth rings in tree trunks; used to determine annual precipitation.","Bacterial shells in seafloor sediments; used to measure oxygen isotopes."],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"ما هي الثغور (Stomata) في النباتات، وكيف تُستخدم في علم المناخ القديم؟","options_ar":["جذور تمتصّ كربونات الكالسيوم؛ تُستخدم لقياس ملوحة المحيط.","ثقوب في الأوراق تنظّم تدفّق CO₂ وH₂O؛ وتُستخدم كثافتها في أحافير الأوراق القديمة لإعادة بناء تراكيز CO₂ الجوية القديمة.","حلقات نمو في جذوع الأشجار؛ تُستخدم لتحديد التساقط السنوي.","أصداف بكتيرية في رواسب قاع البحر؛ تُستخدم لقياس نظائر الأكسجين."]},{"id":"lms-nov-075","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"How does stomata density correlate with atmospheric CO𝟐 levels in plants?","prompt_en":"How does stomata density correlate with atmospheric CO𝟐 levels in plants?","options":["High atmospheric CO2 results in high stomata density.","High atmospheric CO2 results in low stomata density, while low atmospheric CO2 indicates high stomata density.","Stomata density has no relationship with atmospheric CO2.","Low atmospheric CO2 causes plants to have zero stomata."],"options_en":["High atmospheric CO2 results in high stomata density.","High atmospheric CO2 results in low stomata density, while low atmospheric CO2 indicates high stomata density.","Stomata density has no relationship with atmospheric CO2.","Low atmospheric CO2 causes plants to have zero stomata."],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"كيف ترتبط كثافة الثغور بمستويات CO₂ الجوية في النباتات؟","options_ar":["ارتفاع CO₂ الجوي ينتج عنه ارتفاع كثافة الثغور.","ارتفاع CO₂ الجوي ينتج عنه انخفاض كثافة الثغور، أما انخفاض CO₂ الجوي فيدل على كثافة عالية للثغور.","لا علاقة لكثافة الثغور بـCO₂ الجوي.","انخفاض CO₂ الجوي يجعل النباتات بلا ثغور إطلاقًا."]},{"id":"lms-nov-076","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"What is the Phanerozoic eon (\"visible life\"), and how long ago does it span?","prompt_en":"What is the Phanerozoic eon (\"visible life\"), and how long ago does it span?","options":["The last 10,000 years of human civilization.","The last 541 million years, during which Earth's temperature shifted gradually between icehouse and hothouse conditions.","The 2 billion years of Precambrian time.","The 50-year period following the Industrial Revolution."],"options_en":["The last 10,000 years of human civilization.","The last 541 million years, during which Earth's temperature shifted gradually between icehouse and hothouse conditions.","The 2 billion years of Precambrian time.","The 50-year period following the Industrial Revolution."],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"ما دهر الحياة الظاهرة (Phanerozoic eon، «الحياة المرئية»)، وكم يمتد إلى الماضي؟","options_ar":["آخر ١٠٠٠٠ سنة من الحضارة البشرية.","آخر ٥٤١ مليون سنة، انتقلت خلالها حرارة الأرض تدريجيًا بين ظروف «بيت الجليد» و«بيت الدفيئة».","ملياري سنة من زمن ما قبل الكمبري.","فترة الـ٥٠ سنة التي تلت الثورة الصناعية."]},{"id":"lms-nov-077","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"When did permanent ice sheets first appear at the South Pole, ushering in Cenozoic icehouse conditions?","prompt_en":"When did permanent ice sheets first appear at the South Pole, ushering in Cenozoic icehouse conditions?","options":["About 2 million years ago","About 34 million years ago","About 145.5 million years ago","About 10,000 years ago"],"options_en":["About 2 million years ago","About 34 million years ago","About 145.5 million years ago","About 10,000 years ago"],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"متى ظهرت الصفائح الجليدية الدائمة لأول مرة في القطب الجنوبي، مُفتتحةً ظروف «بيت الجليد» في الحقبة المعاصرة (Cenozoic)؟","options_ar":["قبل نحو ٢ مليون سنة","قبل نحو ٣٤ مليون سنة","قبل نحو ١٤٥٫٥ مليون سنة","قبل نحو ١٠٠٠٠ سنة"]},{"id":"lms-nov-078","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"What replaced the lush greenhouse forests (like palm trees in Wyoming and banana trees in Oregon) in North America as the climate cooled?","prompt_en":"What replaced the lush greenhouse forests (like palm trees in Wyoming and banana trees in Oregon) in North America as the climate cooled?","options":["Tundra and permafrost","Open grasslands, which are more suitable for a colder, drier icehouse climate","Dense mangrove swamps","Hyper-arid sand deserts"],"options_en":["Tundra and permafrost","Open grasslands, which are more suitable for a colder, drier icehouse climate","Dense mangrove swamps","Hyper-arid sand deserts"],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"ما الذي حلّ محل الغابات الخضراء الدفيئة (كالنخيل في وايومنغ وأشجار الموز في أوريغون) في أمريكا الشمالية مع تبريد المناخ؟","options_ar":["التندرا والتربة الصقيعية","المراعي المفتوحة، وهي أنسب لمناخ «بيت جليد» أبرد وأجف","مستنقعات المانغروف الكثيفة","صحارٍ رملية شديدة الجفاف"]},{"id":"lms-nov-079","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"What marked the beginning of the Quaternary epoch about 2 million years ago?","prompt_en":"What marked the beginning of the Quaternary epoch about 2 million years ago?","options":["The extinction of the dinosaurs.","Earth's climate being sufficiently frigid to sustain massive ice sheets at both poles, with ice moving far south in the Northern Hemisphere.","The invention of agriculture by human civilization.","The Paleocene-Eocene Thermal Maximum."],"options_en":["The extinction of the dinosaurs.","Earth's climate being sufficiently frigid to sustain massive ice sheets at both poles, with ice moving far south in the Northern Hemisphere.","The invention of agriculture by human civilization.","The Paleocene-Eocene Thermal Maximum."],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"ما الذي مثّل بداية العصر الرباعي قبل نحو ٢ مليون سنة؟","options_ar":["انقراض الديناصورات.","أن يصبح مناخ الأرض باردًا بما يكفي لإدامة صفائح جليدية هائلة عند القطبين، مع تحرّك الجليد مسافات بعيدة جنوبًا في نصف الكرة الشمالي.","اختراع الزراعة من قِبل الحضارة البشرية.","الحد الأقصى الحراري الباليوسيني–الإيوسيني."]},{"id":"lms-nov-080","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"How frequently has the cycle of glacial ice advance and retreat been happening for the last 800,000 years?","prompt_en":"How frequently has the cycle of glacial ice advance and retreat been happening for the last 800,000 years?","options":["Roughly every 11 years","Roughly every 1,000 years","Roughly every 100,000 years","Roughly every 50 million years"],"options_en":["Roughly every 11 years","Roughly every 1,000 years","Roughly every 100,000 years","Roughly every 50 million years"],"correct":2,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"بأي معدّل تواتر تكرّرت دورة تقدّم الجليد الجليدي وتراجعه خلال الـ٨٠٠٠٠٠ سنة الماضية؟","options_ar":["كل ١١ سنة تقريبًا","كل ١٠٠٠ سنة تقريبًا","كل ١٠٠٠٠٠ سنة تقريبًا","كل ٥٠ مليون سنة تقريبًا"]},{"id":"lms-nov-081","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"When did the last significant ice sheet advance peak?","prompt_en":"When did the last significant ice sheet advance peak?","options":["Approximately 2 million years ago","Approximately 18,000 years ago","Approximately 7,000 years ago","Approximately 1783 AD"],"options_en":["Approximately 2 million years ago","Approximately 18,000 years ago","Approximately 7,000 years ago","Approximately 1783 AD"],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"متى بلغ آخر تقدّم كبير للصفائح الجليدية ذروته؟","options_ar":["قبل نحو ٢ مليون سنة","قبل نحو ١٨٠٠٠ سنة","قبل نحو ٧٠٠٠ سنة","نحو عام ١٧٨٣ ميلادي"]},{"id":"lms-nov-082","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"Why are seafloor sediments useful recorders of worldwide climate change?","prompt_en":"Why are seafloor sediments useful recorders of worldwide climate change?","options":["Because they contain petroleum reserves trapped during the Cenozoic.","Because the numbers and types of marine organisms living near the sea surface change with climate, and their dead shells sink to the ocean floor to form a sedimentary record.","Because ocean floor temperatures never change over millions of years.","Because deep-sea sediments absorb cosmic rays directly from space."],"options_en":["Because they contain petroleum reserves trapped during the Cenozoic.","Because the numbers and types of marine organisms living near the sea surface change with climate, and their dead shells sink to the ocean floor to form a sedimentary record.","Because ocean floor temperatures never change over millions of years.","Because deep-sea sediments absorb cosmic rays directly from space."],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"لماذا تُعدّ رواسب قاع البحر سجلّات مفيدة لتغيّر المناخ العالمي؟","options_ar":["لأنها تحتوي احتياطيات بترولية احتُبست خلال الحقبة المعاصرة.","لأن أعداد وأنواع الكائنات البحرية القريبة من سطح البحر تتغيّر مع المناخ، وأصدافها الميتة تغوص إلى قاع المحيط لتشكّل سجلًا رسوبيًا.","لأن حرارة قاع المحيط لا تتغيّر أبدًا على مدى ملايين السنين.","لأن رواسب البحر العميق تمتصّ الأشعة الكونية مباشرة من الفضاء."]},{"id":"lms-nov-083","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"What does oxygen isotope analysis in deep-sea sediment shells and glacial ice rely upon?","prompt_en":"What does oxygen isotope analysis in deep-sea sediment shells and glacial ice rely upon?","options":["Measuring the ratio of carbon-14 to carbon-12.","Measuring the exact ratio of oxygen isotopes, specifically O18 /16O.","Measuring the concentration of dissolved nitrogen gas.","Measuring the radioactivity of uranium-lead decay."],"options_en":["Measuring the ratio of carbon-14 to carbon-12.","Measuring the exact ratio of oxygen isotopes, specifically O18 /16O.","Measuring the concentration of dissolved nitrogen gas.","Measuring the radioactivity of uranium-lead decay."],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"على ماذا يعتمد تحليل نظائر الأكسجين في أصداف الرواسب البحرية العميقة والجليد الجليدي؟","options_ar":["قياس نسبة الكربون-١٤ إلى الكربون-١٢.","قياس النسبة الدقيقة لنظائر الأكسجين، وتحديدًا O¹⁸/O¹⁶.","قياس تركيز غاز النيتروجين المذاب.","قياس إشعاعية تحلّل اليورانيوم–الرصاص."]},{"id":"lms-nov-084","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"What does a greater ratio of O𝟏𝟖 /𝟏𝟔O in marine shells indicate?","prompt_en":"What does a greater ratio of O𝟏𝟖 /𝟏𝟔O in marine shells indicate?","options":["A period when ice sheets were expanding.","A hothouse period with zero ice sheets.","A massive volcanic eruption of sulfur dioxide.","High sunspot activity during the Maunder minimum."],"options_en":["A period when ice sheets were expanding.","A hothouse period with zero ice sheets.","A massive volcanic eruption of sulfur dioxide.","High sunspot activity during the Maunder minimum."],"correct":0,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"إلى ماذا تشير نسبة O¹⁸/O¹⁶ الأعلى في الأصداف البحرية؟","options_ar":["فترة كانت الصفائح الجليدية تتوسّع خلالها.","فترة «بيت دفيئة» بلا أي صفائح جليدية.","ثوران بركاني هائل لثاني أكسيد الكبريت.","نشاط كلف شمسي مرتفع خلال الحد الأدنى لمَوندر."]},{"id":"lms-nov-085","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"How does temperature affect O𝟏𝟖 evaporation and precipitation?","prompt_en":"How does temperature affect O𝟏𝟖 evaporation and precipitation?","options":["When temperatures are high, more O18 evaporates from oceans; when temperatures are low, less evaporates, making the heavy isotope less prevalent during colder times and more prevalent during warm eras.","Temperature has no effect on oxygen isotope evaporation rates.","Colder temperatures cause more O18 to evaporate than warm temperatures.","O18 only exists in solid rock, never in water vapor."],"options_en":["When temperatures are high, more O18 evaporates from oceans; when temperatures are low, less evaporates, making the heavy isotope less prevalent during colder times and more prevalent during warm eras.","Temperature has no effect on oxygen isotope evaporation rates.","Colder temperatures cause more O18 to evaporate than warm temperatures.","O18 only exists in solid rock, never in water vapor."],"correct":0,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"كيف تؤثر الحرارة في تبخّر O¹⁸ وتساقطه؟","options_ar":["عند ارتفاع الحرارة يتبخّر O¹⁸ أكثر من المحيطات؛ وعند انخفاضها يتبخّر أقل، فيكون النظير الثقيل أقل شيوعًا في العصور الباردة وأكثر شيوعًا في العصور الدافئة.","الحرارة لا تؤثر في معدّلات تبخّر نظائر الأكسجين.","الحرارة الأبرد تجعل O¹⁸ يتبخّر أكثر من الحرارة الدافئة.","O¹⁸ يوجد فقط في الصخور الصلبة ولا يوجد قط في بخار الماء."]},{"id":"lms-nov-086","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"How long can vertical ice cores extracted from Antarctic and Greenland ice sheets be, and how many years of climate history might they include?","prompt_en":"How long can vertical ice cores extracted from Antarctic and Greenland ice sheets be, and how many years of climate history might they include?","options":["Up to 100 meters long; 1,000 years of history","Up to 2,000 meters (6,500 feet) long; over 200,000 years of climate history","Up to 10 kilometers long; 50 million years of history","Up to 50 meters long; 500 years of history"],"options_en":["Up to 100 meters long; 1,000 years of history","Up to 2,000 meters (6,500 feet) long; over 200,000 years of climate history","Up to 10 kilometers long; 50 million years of history","Up to 50 meters long; 500 years of history"],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"كم يمكن أن يبلغ طول عينات الجليد الرأسية المستخرجة من الصفائح الجليدية في أنتاركتيكا وغرينلاند، وكم سنة من تاريخ المناخ قد تُغطّي؟","options_ar":["حتى ١٠٠ متر؛ ١٠٠٠ سنة من التاريخ","حتى ٢٠٠٠ متر (٦٥٠٠ قدم)؛ أكثر من ٢٠٠٠٠٠ سنة من تاريخ المناخ","حتى ١٠ كيلومترات؛ ٥٠ مليون سنة من التاريخ","حتى ٥٠ مترًا؛ ٥٠٠ سنة من التاريخ"]},{"id":"lms-nov-087","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"Besides oxygen isotope data, what additional climate records are preserved in glacial ice cores?","prompt_en":"Besides oxygen isotope data, what additional climate records are preserved in glacial ice cores?","options":["Tree ring widths and marine fish populations","Air bubbles recording atmospheric gas composition (such as CO2 and methane), volcanic ash, wind-blown dust, pollen, and contemporary pollution.","Human historical documents and agricultural crop yields.","Stomata density from land plants exclusively."],"options_en":["Tree ring widths and marine fish populations","Air bubbles recording atmospheric gas composition (such as CO2 and methane), volcanic ash, wind-blown dust, pollen, and contemporary pollution.","Human historical documents and agricultural crop yields.","Stomata density from land plants exclusively."],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"إلى جانب بيانات نظائر الأكسجين، ما السجلّات المناخية الأخرى المحفوظة في عينات الجليد الجليدي؟","options_ar":["عرض حلقات الأشجار وأعداد الأسماك البحرية","فقاعات هواء تسجّل تركيب الغازات الجوية (مثل CO₂ والميثان)، والرماد البركاني، والغبار المنقول بالرياح، واللقاح، والتلوث المعاصر.","وثائق تاريخية بشرية ومحاصيل زراعية.","كثافة الثغور من النباتات البرية حصرًا."]},{"id":"lms-nov-088","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"What do tree growth rings reveal about historical climates?","prompt_en":"What do tree growth rings reveal about historical climates?","options":["The thickness and density of tree rings indicate environmental conditions (precipitation and temperature) during each year of growth.","The magnetic field orientation of the Earth at the time of growth.","The exact date of volcanic eruptions through ash layers embedded in the bark.","The concentration of ozone in the stratosphere."],"options_en":["The thickness and density of tree rings indicate environmental conditions (precipitation and temperature) during each year of growth.","The magnetic field orientation of the Earth at the time of growth.","The exact date of volcanic eruptions through ash layers embedded in the bark.","The concentration of ozone in the stratosphere."],"correct":0,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"ماذا تكشف حلقات نمو الأشجار عن المناخات التاريخية؟","options_ar":["تُشير سماكة حلقات الأشجار وكثافتها إلى الظروف البيئية (التساقط والحرارة) خلال كل سنة نمو.","اتجاه المجال المغناطيسي للأرض وقت النمو.","التاريخ الدقيق للثورانات البركانية عبر طبقات الرماد المدمجة في اللحاء.","تركيز الأوزون في الستراتوسفير."]},{"id":"lms-nov-089","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"Why are fossil pollen and spores valuable for reconstructing past climates?","prompt_en":"Why are fossil pollen and spores valuable for reconstructing past climates?","options":["Because plants produce pollen only during icehouse periods.","Because climate is a major factor influencing vegetation distribution, and pollen/spores have very resistant walls that make them abundant and well-preserved in sediments.","Because pollen grains act as direct thermometers in ocean water.","Because pollen records atmospheric pressure changes directly."],"options_en":["Because plants produce pollen only during icehouse periods.","Because climate is a major factor influencing vegetation distribution, and pollen/spores have very resistant walls that make them abundant and well-preserved in sediments.","Because pollen grains act as direct thermometers in ocean water.","Because pollen records atmospheric pressure changes directly."],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"لماذا تُعدّ أحافير اللقاح والأبواغ قيّمة لإعادة بناء المناخات الماضية؟","options_ar":["لأن النباتات تُنتج اللقاح فقط في عصور «بيت الجليد».","لأن المناخ عامل رئيسي في توزيع الغطاء النباتي، ولللقاح والأبواغ جدران شديدة المقاومة تجعلها وفيرة ومحفوظة جيدًا في الرواسب.","لأن حبيبات اللقاح تعمل كمقاييس حرارة مباشرة في مياه المحيط.","لأن اللقاح يسجّل تغيّرات الضغط الجوي مباشرة."]},{"id":"lms-nov-090","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"How do corals function as a \"paleothermometer\"?","prompt_en":"How do corals function as a \"paleothermometer\"?","options":["They measure air temperature in the thermosphere using satellite telemetry.","They extract calcium carbonate (CaCO3) from seawater to build skeletons containing oxygen isotopes reflecting water temperature, and exhibit seasonal growth bands due to density variations.","They migrate to different latitudes when water temperatures change by 1∘C.","They burn up when exposed to ultraviolet radiation."],"options_en":["They measure air temperature in the thermosphere using satellite telemetry.","They extract calcium carbonate (CaCO3) from seawater to build skeletons containing oxygen isotopes reflecting water temperature, and exhibit seasonal growth bands due to density variations.","They migrate to different latitudes when water temperatures change by 1∘C.","They burn up when exposed to ultraviolet radiation."],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"كيف تعمل الشعاب المرجانية كـ«ميزان حرارة قديم» (paleothermometer)؟","options_ar":["تقيس حرارة الهواء في الثيرموسفير عبر القياس عن بُعد بالأقمار الصناعية.","تستخلص كربونات الكالسيوم (CaCO₃) من مياه البحر لتبني هياكل تحتوي نظائر أكسجين تعكس حرارة الماء، وتُظهر أشرطة نمو فصلية بسبب تباين الكثافة.","تهاجر إلى خطوط عرض مختلفة عندما تتغيّر حرارة الماء بمقدار ١°م.","تحترق عند تعرّضها للأشعة فوق البنفسجية."]},{"id":"lms-nov-091","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"What can oxygen isotope analysis of coral-growth rings serve as a proxy measurement for in areas with large annual rainfall variations?","prompt_en":"What can oxygen isotope analysis of coral-growth rings serve as a proxy measurement for in areas with large annual rainfall variations?","options":["Wind speed","Precipitation","Atmospheric pressure","Solar irradiance"],"options_en":["Wind speed","Precipitation","Atmospheric pressure","Solar irradiance"],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"ماذا يمكن أن يقدّمه تحليل نظائر الأكسجين في حلقات نمو المرجان كقياس بديل في مناطق ذات تباين كبير في الأمطار السنوية؟","options_ar":["سرعة الرياح","التساقط","الضغط الجوي","الإشعاع الشمسي"]},{"id":"lms-nov-092","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"Why are historical documents sometimes challenging to use for precise climate analysis?","prompt_en":"Why are historical documents sometimes challenging to use for precise climate analysis?","options":["Because ancient manuscripts were written in languages that cannot be translated.","Because most manuscripts were written for purposes other than climate description, neglecting periods of stable atmospheric conditions and mentioning only extremes like droughts, severe storms, and blizzards.","Because historical documents are always falsified or exaggerated.","Because they only contain records from the 20th century."],"options_en":["Because ancient manuscripts were written in languages that cannot be translated.","Because most manuscripts were written for purposes other than climate description, neglecting periods of stable atmospheric conditions and mentioning only extremes like droughts, severe storms, and blizzards.","Because historical documents are always falsified or exaggerated.","Because they only contain records from the 20th century."],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"لماذا قد يكون استخدام الوثائق التاريخية صعبًا أحيانًا في التحليل المناخي الدقيق؟","options_ar":["لأن المخطوطات القديمة كُتبت بلغات لا يمكن ترجمتها.","لأن معظم المخطوطات كُتبت لأغراض غير وصف المناخ، فأغفلت فترات الاستقرار الجوي وذكرت فقط الحالات المتطرفة كالجفاف والعواصف الشديدة والعواصف الثلجية.","لأن الوثائق التاريخية دائمًا مزوّرة أو مبالغ فيها.","لأنها تحتوي سجلات القرن العشرين فقط."]},{"id":"lms-nov-093","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"What do harvest dates for the beginning of the grape harvest in the fall provide in European historical records?","prompt_en":"What do harvest dates for the beginning of the grape harvest in the fall provide in European historical records?","options":["A measure of volcanic sulfur dioxide emissions.","An integrated measure of temperature and precipitation during the growing season, providing a useful record of year-to-year climate variations.","The exact date of sunspot maximums.","Evidence of prehistoric ice sheet advances."],"options_en":["A measure of volcanic sulfur dioxide emissions.","An integrated measure of temperature and precipitation during the growing season, providing a useful record of year-to-year climate variations.","The exact date of sunspot maximums.","Evidence of prehistoric ice sheet advances."],"correct":1,"explanatio ic)","حقبة الحياة الوسطى (Mesozoic)","دهر ما قبل الكمبري","العصر الرباعي"]},{"id":"lms-nov-105","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"How far south in the Northern Hemisphere did ice move during the Quaternary ice advances before retreating to Greenland?","prompt_en":"How far south in the Northern Hemisphere did ice move during the Quaternary ice advances before retreating to Greenland?","options":["As far south as the modern-day Ohio River","As far south as the Gulf of Mexico","Only as far as the Arctic Circle","As far south as the Equator"],"options_en":["As far south as the modern-day Ohio River","As far south as the Gulf of Mexico","Only as far as the Arctic Circle","As far south as the Equator"],"correct":0,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 3"],"published":true,"prompt_ar":"إلى أي مدى جنوبًا في نصف الكرة الشمالي وصل الجليد أثناء التقدّمات الجليدية الرباعية قبل أن يتراجع إلى غرينلاند؟","options_ar":["جنوبًا حتى نهر أوهايو الحالي","جنوبًا حتى خليج المكسيك","حتى الدائرة القطبية الشمالية فقط","جنوبًا حتى خط الاستواء"]},{"id":"lms-nov-106","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"How much solar variation has been experienced in the past 140 years according to satellite and solar measurements?","prompt_en":"How much solar variation has been experienced in the past 140 years according to satellite and solar measurements?","options":["Very massive variations exceeding 50% total energy output.","Very little solar variation.","A steady linear increase of 10% per decade.","Complete cessation of solar radiation during winter months."],"options_en":["Very massive variations exceeding 50% total energy output.","Very little solar variation.","A steady linear increase of 10% per decade.","Complete cessation of solar radiation during winter months."],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","diffic ot activity (number of sunspots reaching a maximum)?","prompt_en":"What is the approximate cycle length of sunspot activity (number of sunspots reaching a maximum)?","options":["Every 5 years","Every 11 years","Every 100,000 years","Every 50 million years"],"options_en":["Every 5 years","Every 11 years","Every 100,000 years","Every 50 million years"],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 4"],"published":true,"prompt_ar":"ما الطول التقريبي لدورة نشاط البقع الشمسية (بلوغ عدد البقع ذروته)؟","options_ar":["كل ٥ سنوات","كل ١١ سنة","كل ١٠٠٠٠٠ سنة","كل ٥٠ مليون سنة"]},{"id":"lms-nov-109","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"Based on space measurements since 1978, what is the magnitude of solar variation during an 11-year sunspot cycle?","prompt_en":"Based on space measurements since 1978, what is the magnitude of solar variation during an 11-year sunspot cycle?","options":["About 0.1%","About 5%","About 25%","About 50%"],"options_en":["About 0.1%","About 5%","About 25%","About 50%"],"correct":0,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 4"],"published":true,"prompt_ar":"استنادًا إلى القياسات الفضائية منذ ١٩٧٨، ما مقدار التغيّر الشمسي خلال دورة بقع شمسية مدتها ١١ سنة؟","options_ar":["نحو ٠٫١٪","نحو ٥٪","نحو ٢٥٪","نحو ٥٠٪"]},{"id":"lms-nov-110","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"What was the Maunder minimum (1645–1715)?","prompt_en":"What was the Maunder minimum (1645–1715)?","options":["A period of maximum sunspot activity corresponding with global hothouse conditions.","A period during which sunspots were largely absent, closely corresponding with the Little Ice Age cold period in Europe.","A period of massive volcanic eruptions across Indonesia.","The time when sea levels rose by 200 meters."],"options_en":["A period of maximum sunspot activity corresponding with global hothouse conditions.","A period during which sunspots were largely absent, closely corresponding with the Little Ice Age cold period in Europe.","A period of massive volcanic eruptions across Indonesia.","The time when sea levels rose by 200 meters."],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 4"],"published":true,"prompt_ar":"ما كان الحد الأدنى لمَوندر (Maunder minimum، ١٦٤٥–١٧١٥)؟","options_ar":["فترة ذروة في نشاط البقع الشمسية تزامنت مع ظروف دفيئة عالمية.","فترة غابت فيها البقع الشمسية إلى حد كبير، وتزامنت تزامنًا وثيقًا مع فترة البرودة في «العصر الجليدي الصغير» في أوروبا.","فترة ثورانات بركانية هائلة في أنحاء إندونيسيا.","الفترة التي ارتفع فيها مستوى البحر ٢٠٠ متر."]},{"id":"lms-nov-111","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"How do large explosive volcanic eruptions affect the Earth's surface temperature?","prompt_en":"How do large explosive volcanic eruptions affect the Earth's surface temperature?","options":["They warm the troposphere by releasing large amounts of carbon dioxide and water vapor.","They inject huge quantities of gases (like SO2) and fine-grained debris/aerosols high into the atmosphere, which filter out incoming solar radiation and cool the earth's surface.","They increase global albedo by melting polar ice sheets.","They destroy the ozone layer in the troposphere."],"options_en":["They warm the troposphere by releasing large amounts of carbon dioxide and water vapor.","They inject huge quantities of gases (like SO2) and fine-grained debris/aerosols high into the atmosphere, which filter out incoming solar radiation and cool the earth's surface.","They increase global albedo by melting polar ice sheets.","They destroy the ozone layer in the troposphere."],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 4"],"published":true,"prompt_ar":"كيف تؤثر الثورانات البركانية الانفجارية الكبيرة في حرارة سطح الأرض؟","options_ar":["تُدفئ التروبوسفير بإطلاق كميات كبيرة من ثاني أكسيد الكربون وبخار الماء.","تحقن كميات هائلة من الغازات (مثل SO₂) والحطام الدقيق والهباء في أعالي الغلاف الجوي، فتُرشّح الإشعاع الشمسي الساقط وتُبرّد سطح الأرض.","تزيد الألبيدو العالمي بإذابة الصفائح الجليدية القطبية.","تُدمّر طبقة الأوزون في التروبوسفير."]},{"id":"lms-nov-112","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"What event followed the 1815 eruption of Mount Tambora in Indonesia, the largest eruption of modern times?","prompt_en":"What event followed the 1815 eruption of Mount Tambora in Indonesia, the largest eruption of modern times?","options":["The Paleocene-Eocene Thermal Maximum","The \"year without a summer\" in 1816, with heavy snow in June and frost in July/August across northeastern US, Canada, and Western Europe.","A 10-year drought across the Middle East.","The complete melting of Arctic sea ice."],"options_en":["The Paleocene-Eocene Thermal Maximum","The \"year without a summer\" in 1816, with heavy snow in June and frost in July/August across northeastern US, Canada, and Western Europe.","A 10-year drought across the Middle East.","The complete melting of Arctic sea ice."],"correct":1,"explanation":"","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["بنك نوفمبر LMS","Part 4"],"published":true,"prompt_ar":"ما الحدث الذي تلا ثوران جبل تامبورا في إندونيسيا عام ١٨١٥، وهو الأكبر في العصر الحديث؟","options_ar":["الحد الأقصى الحراري الباليوسيني–الإيوسيني","«العام بلا صيف» في ١٨١٦، بثلوج كثيفة في يونيو وصقيع في يوليو/أغسطس في شمال شرق الولايات المتحدة وكندا وأوروبا الغربية.","جفاف دام ١٠ سنوات في الشرق الأوسط.","ذوبان كامل لجليد البحر في القطب الشمالي."]},{"id":"lms-nov-113","subject_id":"esd217","lecture_id":"esd217-november-bank","prompt":"Which three more recent volcanic events have provided considerable data and insight regarding volcanic  guiding the system. (IT_lecture_1_2026.pdf, p. 4)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Built from original lecture-1 slides"],"published":true,"prompt_ar":"أي ترتيب يمثّل الأنشطة النموذجية للنظام؟","options_ar":["الإدخال، المعالجة، الإخراج، التغذية الراجعة والتحكم","التخزين، الإخراج، الإدخال، الشبكات","الإخراج، المعالجة، الإدخال، التخزين","الإدخال، الإخراج، التخزين، البرمجة"],"explanation_ar":"أنشطة النظام النموذجية: الإدخال — تجميع العناصر الداخلة للنظام؛ المعالجة — تحويل المُدخل إلى مُخرجات؛ الإخراج — نقل النتيجة إلى المستخدم؛ التغذية الراجعة والتحكم — مقارنة النتيجة بالهدف وتصحيح الأداء. (IT_lecture_1_2026.pdf, p. 4)"},{"id":"cse013-l1-q2","subject_id":"cse013","lecture_id":"cse013-intro","prompt":"In the engineering-system example, what is the INPUT?","prompt_en":"","options":["Sensor measurements","Controller / algorithm","Actuator / action","Measured response"],"options_en":[],"correct":0,"explanation":"INPUT: Sensor measurements. PROCESSING: Controller / algorithm. OUTPUT: Actuator / action. FEEDBACK: Measured response. (IT_lecture_1_2026.pdf, p. 5)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Built from original lecture-1 slides"],"published":true,"prompt_ar":"في مثال النظام الهندسي، ما هو الإدخال (INPUT)؟","options_ar":["قراءات المستشعرات","المتحكم / الخوارزمية","المشغّل / الفعل","الاستجابة المقاسة"],"explanation_ar":"الإدخال: قراءات المستشعرات. المعالجة: المتحكم / الخوارزمية. الإخراج: المشغّل / الفعل. التغذية الراجعة: الاستجابة المقاسة. (IT_lecture_1_2026.pdf, p. 5)"},{"id":"cse013-l1-q3","subject_id":"cse013","lecture_id":"cse013-intro","prompt":"Which statement best describes Information Technology (IT)?","prompt_en":"","options":["Technology used to support information processing: hardware, software, networks and related technologies","The complete set of resources and activities used to deliver information","Only the people who use a system","Only the data stored in a database"],"options_en":[],"correct":0,"explanation":"IT is a major part of an information system—not the whole system. (IT_lecture_1_2026.pdf, p. 7)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Built from original lecture-1 slides"],"published":true,"prompt_ar":"أي عبارة تصف تقنية المعلومات (IT) أفضل وصف؟","options_ar":["التقنية المستخدمة لدعم معالجة المعلومات: العتاد والبرمجيات والشبكات والتقنيات المرتبطة","المجموعة الكاملة من الموارد والأنشطة المستخدمة لتقديم المعلومات","الأشخاص الذين يستخدمون النظام فقط","البيانات المخزّنة في قاعدة البيانات فقط"],"explanation_ar":"تقنية المعلومات جزء كبير من نظام المعلومات — وليست النظام كله. (IT_lecture_1_2026.pdf، ص 7)"},{"id":"cse013-l1-q4","subject_id":"cse013","lecture_id":"cse013-intro","prompt":"How many major IS resources does the lecture identify?","prompt_en":"","options":["Three","Five","Seven","Ten"],"options_en":[],"correct":1,"explanation":"The Five Major IS Resources: PEOPLE — Users & specialists; HARDWARE — Physical devices; SOFTWARE — Instructions & programs; DATA — Facts & observations; NETWORKS — Communication resources. (IT_lecture_1_2026.pdf, p. 8)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Built from original lecture-1 slides"],"published":true,"prompt_ar":"كم عدد موارد نظام المعلومات (IS) الرئيسية التي تحددها المحاضرة؟","options_ar":["ثلاثة","خمسة","سبعة","عشرة"],"explanation_ar":"موارد نظام المعلومات الخمسة: الأشخاص — المستخدمون والمتخصصون؛ العتاد — الأجهزة المادية؛ البرمجيات — تعليمات التشغيل؛ البيانات؛ الشبكات. (IT_lecture_1_2026.pdf, p. 8)"},{"id":"cse013-l1-q5","subject_id":"cse013","lecture_id":"cse013-intro","prompt":"What are the five activities an Information System performs?","prompt_en":"","options":["Input, Process, Output, Storage, Control","Input, Output, Storage, Control, Networking","Process, Output, Storage, Control, Design","Input, Process, Output, Storage, Programming"],"options_en":[],"correct":0,"explanation":"1 INPUT 2 PROCESS 3 OUTPUT 4 STORAGE 5 CONTROL. (IT_lecture_1_2026.pdf, p. 9)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Built from original lecture-1 slides"],"published":true,"prompt_ar":"ما الأنشطة الخمسة التي يؤديها نظام المعلومات؟","options_ar":["الإدخال، المعالجة، الإخراج، التخزين، التحكم","الإدخال، الإخراج، التخزين، التحكم، الشبكات","المعالجة، الإخراج، التخزين، التحكم، التصميم","الإدخال، المعالجة، الإخراج، التخزين، البرمجة"],"explanation_ar":"١ الإدخال — ٢ المعالجة — ٣ الإخراج — ٤ التخزين — ٥ التحكم. (IT_lecture_1_2026.pdf، ص 9)"},{"id":"cse013-l1-q6","subject_id":"cse013","lecture_id":"cse013-intro","prompt":"Which of these is an Operations Support System?","prompt_en":"","options":["Transaction Processing Systems (TPS)","Management Information Systems (MIS)","Decision Support Systems (DSS)","Executive Information Systems (EIS)"],"options_en":[],"correct":0,"explanation":"Operations Support Systems: Transaction Processing Systems (TPS), Process Control Systems (PCS), Enterprise Collaboration Systems. (IT_lecture_1_2026.pdf, p. 11)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Built from original lecture-1 slides"],"published":true,"prompt_ar":"أي مما يلي من أنظمة دعم العمليات؟","options_ar":["أنظمة معالجة المعاملات (TPS)","نظم المعلومات الإدارية (MIS)","أنظمة دعم القرار (DSS)","أنظمة معلومات الإدارة التنفيذية (EIS)"],"explanation_ar":"أنظمة دعم العمليات: أنظمة معالجة المعاملات (TPS)، وأنظمة التحكم في العمليات (PCS)، وأنظمة التعاون المؤسسي. (IT_lecture_1_2026.pdf, p. 11)"},{"id":"cse013-l1-q7","subject_id":"cse013","lecture_id":"cse013-intro","prompt":"What does a Transaction Processing System (TPS) do?","prompt_en":"","options":["Collects, stores, modifies, and retrieves routine daily business transactions","Monitors and regulates physical variables like temperature, pressure, and flow rates","Supports executive long-term planning only","Designs mechanical parts"],"options_en":[],"correct":0,"explanation":"A Transaction Processing System (TPS) is a software-based information system that collects, stores, modifies, and retrieves routine daily business transactions. (IT_lecture_1_2026.pdf, p. 12)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Built from original lecture-1 slides"],"published":true,"prompt_ar":"ماذا يفعل نظام معالجة المعاملات (TPS)؟","options_ar":["يجمع ويخزّن ويعدّل ويسترجع معاملات الأعمال اليومية الروتينية","يراقب المتغيرات الفيزيائية مثل الحرارة والضغط ومعدلات التدفق وينظّمها","يدعم التخطيط التنفيذي طويل المدى فقط","يصمم الأجزاء الميكانيكية"],"explanation_ar":"نظام معالجة المعاملات (TPS) نظام معلومات قائم على البرمجيات يجمع ويخزّن ويعدّل ويسترجع معاملات الأعمال اليومية الروتينية. (IT_lecture_1_2026.pdf, p. 12)"},{"id":"cse013-l1-q8","subject_id":"cse013","lecture_id":"cse013-intro","prompt":"What does a Process Control System (PCS) monitor and regulate?","prompt_en":"","options":["Physical variables like temperature, pressure, and flow rates","Student grades only","Website colour codes","Employee salaries only"],"options_en":[],"correct":0,"explanation":"A Process Control System (PCS) is an industrial automation network that monitors and regulates physical variables like temperature, pressure, and flow rates. (IT_lecture_1_2026.pdf, p. 14)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Built from original lecture-1 slides"],"published":true,"prompt_ar":"ما الذي يراقبه وينظّمه نظام التحكم في العمليات (PCS)؟","options_ar":["المتغيرات الفيزيائية مثل الحرارة والضغط ومعدلات التدفق","درجات الطلاب فقط","أكواد ألوان المواقع فقط","رواتب الموظفين فقط"],"explanation_ar":"نظام التحكم في العمليات (PCS) شبكة أتمتة صناعية تراقب المتغيرات الفيزيائية مثل الحرارة والضغط ومعدلات التدفق وتنظّمها. (IT_lecture_1_2026.pdf, p. 14)"},{"id":"cse013-l1-q9","subject_id":"cse013","lecture_id":"cse013-intro","prompt":"Which ethical challenge asks «who should have access to personal or organizational data?»","prompt_en":"","options":["Privacy","Accuracy","Intellectual property","Security"],"options_en":[],"correct":0,"explanation":"Privacy — who should have access to personal or organizational data? (IT_lecture_1_2026.pdf, p. 19)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Built from original lecture-1 slides"],"published":true,"prompt_ar":"أي تحدٍّ أخلاقي يطرح سؤال «من يحق له الوصول إلى البيانات الشخصية أو بيانات المؤسسة؟»","options_ar":["الخصوصية","الدقة","الملكية الفكرية","الأمان"],"explanation_ar":"الخصوصية — من يحق له الوصول إلى البيانات الشخصية أو بيانات المؤسسة؟ (IT_lecture_1_2026.pdf، ص 19)"},{"id":"cse013-l1-q10","subject_id":"cse013","lecture_id":"cse013-intro","prompt":"Which of these is NOT one of the three Quick Practice examples?","prompt_en":"","options":["A computer mouse","University LMS","Smart Factory","Online Store"],"options_en":[],"correct":0,"explanation":"Quick Practice: What Is the Information System? University LMS, Smart Factory, Online Store. (IT_lecture_1_2026.pdf, p. 22)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Built from original lecture-1 slides"],"published":true,"prompt_ar":"أي مما يلي ليس من أمثلة التدريب السريع الثلاثة؟","options_ar":["فأرة الكمبيوتر","نظام إدارة التعلّم الجامعي (LMS)","المصنع الذكي","المتجر الإلكتروني"],"explanation_ar":"تدريب سريع: ما هو نظام المعلومات؟ نظام إدارة التعلّم الجامعي، المصنع الذكي، المتجر الإلكتروني. (IT_lecture_1_2026.pdf، ص 22)"},{"id":"cse013-l2-q1","subject_id":"cse013","lecture_id":"cse013-hardware","prompt":"Which component performs arithmetic and logical operations?","prompt_en":"","options":["Control Unit","Cache","Storage","ALU"],"options_en":[],"correct":3,"explanation":"The ALU performs arithmetic and logical operations required by instructions. (IT_lecture_2_2026.pdf, p. 9; answer key p. 41)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Original PDF review bank · IT_lecture_2_2026.pdf pp. 35–41"],"published":true,"prompt_ar":"أي مكوّن ينفّذ العمليات الحسابية والمنطقية؟","options_ar":["وحدة التحكم","الذاكرة المخبئية","التخزين","وحدة الحساب والمنطق (ALU)"],"explanation_ar":"وحدة الحساب والمنطق (ALU) تنفّذ العمليات الحسابية والمنطقية التي تتطلبها التعليمات. (IT_lecture_2_2026.pdf، ص 9؛ مفتاح الإجابة ص 41)"},{"id":"cse013-l2-q2","subject_id":"cse013","lecture_id":"cse013-hardware","prompt":"What is the main role of the Control Unit (CU)?","prompt_en":"","options":["Store files permanently","Display information","Coordinate CPU activities","Perform arithmetic calculations"],"options_en":[],"correct":2,"explanation":"The Control Unit directs and coordinates CPU activities; it manages the sequence and does not perform the main arithmetic calculations. (IT_lecture_2_2026.pdf, p. 10; answer key p. 41)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Original PDF review bank · IT_lecture_2_2026.pdf pp. 35–41"],"published":true,"prompt_ar":"ما الدور الرئيسي لوحدة التحكم (CU)؟","options_ar":["تخزين الملفات بشكل دائم","عرض المعلومات","تنسيق أنشطة المعالج","إجراء الحسابات الرياضية"],"explanation_ar":"وحدة التحكم توجّه أنشطة المعالج وتنسّقها؛ فهي تدير التسلسل ولا تنفّذ الحسابات الأساسية نفسه. (IT_lecture_2_2026.pdf، ص 10؛ مفتاح الإجابة ص 41)"},{"id":"cse013-l2-q3","subject_id":"cse013","lecture_id":"cse013-hardware","prompt":"Which memory is located close to the CPU and stores frequently used data?","prompt_en":"","options":["SSD","USB drive","Optical disk","Cache"],"options_en":[],"correct":3,"explanation":"Cache is high-speed memory close to the CPU; it stores frequently used data and instructions and reduces CPU waiting time. (IT_lecture_2_2026.pdf, p. 11; answer key p. 41)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Original PDF review bank · IT_lecture_2_2026.pdf pp. 35–41"],"published":true,"prompt_ar":"أي ذاكرة تقع قريبة من المعالج وتخزّن البيانات _2026.pdf, p. 18; answer key p. 78)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Original PDF review bank · IT_lecture_3_2026.pdf pp. 72–78"],"published":true,"prompt_ar":"ما الدور الرئيسي لنظام إدارة قواعد البيانات (DBMS)؟","options_ar":["إدارة إنشاء قواعد البيانات واستخدامها وصيانتها","استبدال كل أجهزة الإدخال","قياس القيم الفيزيائية مباشرة","تصميم معالجات الحاسوب"],"explanation_ar":"DBMS برمجية تساعد على إنشاء قاعدة البيانات وصيانتها والاستعلام عنها والتحكم في الوصول إليها. (IT_lecture_3_2026.pdf، ص 18؛ مفتاح الإجابة ص 78)"},{"id":"cse013-l3-q5","subject_id":"cse013","lecture_id":"cse013-data","prompt":"Which database structure organizes data in rows and columns?","prompt_en":"","options":["Hierarchical only","Relational","Network only","Sequential file"],"options_en":[],"correct":1,"explanation":"Relational: data is organized in tables made of rows and columns. (IT_lecture_3_2026.pdf, p. 30; answer key p. 78)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Original PDF review bank · IT_lecture_3_2026.pdf pp. 72–78"],"published":true,"prompt_ar":"أي هيكل لقاعدة بيانات ينظّم البيانات في صفوف وأعمدة؟","options_ar":["الهرمي فقط","العلائقي","الشبكي فقط","الملف التسلسلي"],"explanation_ar":"العلائقي: البيانات منظّمة في جداول مكوّنة من صفوف وأعمدة. (IT_lecture_3_2026.pdf، ص 30؛ مفتاح الإجابة ص 78)"},{"id":"cse013-l3-q6","subject_id":"cse013","lecture_id":"cse013-data","prompt":"What does a primary key do?","prompt_en":"","options":["Stores a backup copy","Formats a printed report","Uniquely identifies a record","Converts data into an image"],"options_en":[],"correct":2,"explanation":"A primary key is a field (or set of fields) that uniquely identifies each record. (IT_lecture_3_2026.pdf, p. 33; answer key p. 78)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Original PDF review bank · IT_lecture_3_2026.pdf pp. 72–78"],"published":true,"prompt_ar":"ماذا يفعل المفتاح الأساسي (Primary key)؟","options_ar":["يخزّن نسخة احتياطية","ينسّق تقريرًا مطبوعًا","يحدد السجل بشكل فريد","يحوّل البيانات إلى صورة"],"explanation_ar":"المفتاح الأساسي حقل (أو مجموعة حقول) يحدد كل سجل بشكل فريد. (IT_lecture_3_2026.pdf، ص 33؛ مفتاح الإجابة ص 78)"},{"id":"cse013-l3-q7","subject_id":"cse013","lecture_id":"cse013-data","prompt":"What is a data warehouse mainly used for?","prompt_en":"","options":["Typing individual records only","Replacing all operational systems","Controlling a sensor directly","Bringing together data for analysis"],"options_en":[],"correct":3,"explanation":"A data warehouse is a large repository that brings data together from different operational and other sources for analysis. (IT_lecture_3_2026.pdf, p. 25; answer key p. 78)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Original PDF review bank · IT_lecture_3_2026.pdf pp. 72–78"],"published":true,"prompt_ar":"فيمَ يُستخدم مستودع البيانات أساسًا؟","options_ar":["كتابة سجلات فردية فقط","استبدال كل الأنظمة التشغيلية","التحكم في مستشعر مباشرة","جمع البيانات معًا للتحليل"],"explanation_ar":"مستودع البيانات مستودع كبير يجمع البيانات من مصادر تشغيلية مختلفة وغيرها لدعم التحليل. (IT_lecture_3_2026.pdf، ص 25؛ مفتاح الإجابة ص 78)"},{"id":"cse013-l3-q8","subject_id":"cse013","lecture_id":"cse013-data","prompt":"Which example best describes data mining?","prompt_en":"","options":["Searching for patterns in machine failure records","Renaming a file","Adding a keyboard","Formatting a table heading"],"options_en":[],"correct":0,"explanation":"Data mining: analyzing large collections of data to identify patterns or trends. (IT_lecture_3_2026.pdf, p. 26; answer key p. 78)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Original PDF review bank · IT_lecture_3_2026.pdf pp. 72–78"],"published":true,"prompt_ar":"أي مثال يصف تنقيب البيانات (Data mining) أفضل وصف؟","options_ar":["البحث عن أنماط في سجلات أعطال الماكينات","إعادة تسمية ملف","إضافة لوحة مفاتيح","تنسيق عنوان جدول"],"explanation_ar":"تنقيب البيانات: تحليل مجموعات كبيرة من البيانات لتحديد أنماط أو اتجاهات. (IT_lecture_3_2026.pdf، ص 26؛ مفتاح الإجابة ص 78)"},{"id":"cse013-l3-q9","subject_id":"cse013","lecture_id":"cse013-data","prompt":"What is metadata?","prompt_en":"","options":["Duplicate data","Data about data","A type of input device","A computer processor"],"options_en":[],"correct":1,"explanation":"Metadata: data about data. Example: a field called Temperature_Value has type decimal and unit °C. (IT_lecture_3_2026.pdf, p. 38; answer key p. 78)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Original PDF review bank · IT_lecture_3_2026.pdf pp. 72–78"],"published":true,"prompt_ar":"ما هي البيانات الوصفية (Metadata)؟","options_ar":["بيانات مكررة","بيانات عن البيانات","نوع من أجهزة الإدخال","معالج حاسوب"],"explanation_ar":"البيانات الوصفية: بيانات عن البيانات. مثال: حقل باسم Temperature_Value نوعه عشري ووحدته °C. (IT_lecture_3_2026.pdf، ص 38؛ مفتاح الإجابة ص 78)"},{"id":"cse013-l3-q10","subject_id":"cse013","lecture_id":"cse013-data","prompt":"Which is an example of a foreign key?","prompt_en":"","options":["A report title","A unit label only","Sensor_ID in a measurement table that refers to the SENSOR table","A database file name"],"options_en":[],"correct":2,"explanation":"A foreign key is a field that refers to a key in another table to connect related records. Example: a Measurement table stores Sensor_ID to show which sensor produced each reading. (IT_lecture_3_2026.pdf, p. 33–34; answer key p. 78)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Original PDF review bank · IT_lecture_3_2026.pdf pp. 72–78"],"published":true,"prompt_ar":"أي مما يلي مثال على مفتاح أجنبي (Foreign key)؟","options_ar":["عنوان تقرير","تسمية وحدة فقط","Sensor_ID في جدول القياسات يشير إلى جدول SENSOR","اسم ملف قاعدة بيانات"],"explanation_ar":"المفتاح الأجنبي حقل يشير إلى مفتاح في جدول آخر لربط السجلات المترابطة. مثال: جدول القياسات يحتوي Sensor_ID يشير إلى جدول SENSOR. (IT_lecture_3_2026.pdf، ص 34؛ مفتاح الإجابة ص 78)"},{"id":"cse013-l3-q11","subject_id":"cse013","lecture_id":"cse013-data","prompt":"What does a data dictionary describe?","prompt_en":"","options":["Only the number of computers in a lab","How to print slides","The speed of a CPU","Data fields, meanings, formats and rules"],"options_en":[],"correct":3,"explanation":"A data dictionary is a catalog describing data fields, formats, meanings, allowed values and relationships. (IT_lecture_3_2026.pdf, p. 38; answer key p. 78)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Original PDF review bank · IT_lecture_3_2026.pdf pp. 72–78"],"published":true,"prompt_ar":"ماذا يصف قاموس البيانات (Data dictionary)؟","options_ar":["عدد الحواسيب في المعمل فقط","طريقة طباعة الشرائح","سرعة المعالج","حقول البيانات ومعانيها وصيغها وقواعدها"],"explanation_ar":"قاموس البيانات فهرس يصف حقول البيانات وصيغها ومعانيها وقيمها المسموحة وعلاقاتها. (IT_lecture_3_2026.pdf، ص 38؛ مفتاح الإجابة ص 78)"},{"id":"cse013-l3-q12","subject_id":"cse013","lecture_id":"cse013-data","prompt":"Why is data quality important in engineering?","prompt_en":"","options":["Incorrect or unclear measurements can lead to poor decisions","It makes units unnecessary","It guarantees every prediction is correct","It removes the need for testing"],"options_en":[],"correct":0,"explanation":"A database cannot make poor input data trustworthy by itself. (IT_lecture_3_2026.pdf, p. 40; answer key p. 78)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Original PDF review bank · IT_lecture_3_2026.pdf pp. 72–78"],"published":true,"prompt_ar":"لماذا جودة البيانات مهمة في الهندسة؟","options_ar":["القياسات غير الصحيحة أو غير الواضحة قد تؤدي إلى قرارات سيئة","تجعل الوحدات غير ضرورية","تضمن أن كل تنبؤ صحيح","تلغي الحاجة للاختبار"],"explanation_ar":"قاعدة البيانات لا تستطيع أن تجعل بيانات إدخال سيئة موثوقة بذاتها. (IT_lecture_3_2026.pdf، ص 40؛ مفتاح الإجابة ص 78)"},{"id":"cse013-num-q1","subject_id":"cse013","lecture_id":"cse013-number-systems","prompt":"What is the base of the binary number system?","prompt_en":"","options":["2","8","10","16"],"options_en":[],"correct":0,"explanation":"Quiz answer key: 1 A — base 2. (IT_Number_Systems.pdf, p. 36). Binary uses only 0 and 1. (IT_Number_Systems.pdf, p. 7)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Original PDF quick quiz · IT_Number_Systems.pdf pp. 34–36"],"published":true,"prompt_ar":"ما أساس نظام العد الثنائي؟","options_ar":["٢","٨","١٠","١٦"],"explanation_ar":"مفتاح إجابة الاختبار: ١ A — الأساس ٢. (IT_Number_Systems.pdf، ص 36). الثنائي يستخدم ٠ و١ فقط."},{"id":"cse013-num-q2","subject_id":"cse013","lecture_id":"cse013-number-systems","prompt":"How many bits are in a byte?","prompt_en":"","options":["4","8","16","32"],"options_en":[],"correct":1,"explanation":"Quiz answer key: 2 B — 8 bits per byte. (IT_Number_Systems.pdf, p. 36). Nibble: 4 bits; Byte: 8 bits. (IT_Number_Systems.pdf, p. 4)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Original PDF quick quiz · IT_Number_Systems.pdf pp. 34–36"],"published":true,"prompt_ar":"كم بتًا في البايت؟","options_ar":["٤","٨","١٦","٣٢"],"explanation_ar":"مفتاح إجابة الاختبار: ٢ B — ٨ بتات في البايت. (IT_Number_Systems.pdf، ص 36). النيبل ٤ بتات، والبايت ٨ بتات."},{"id":"cse013-num-q3","subject_id":"cse013","lecture_id":"cse013-number-systems","prompt":"1010₂ in decimal?","prompt_en":"","options":["8","9","10","12"],"options_en":[],"correct":2,"explanation":"Quiz answer key: 3 C — 8+2=10. (IT_Number_Systems.pdf, p. 36)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Original PDF quick quiz · IT_Number_Systems.pdf pp. 34–36"],"published":true,"prompt_ar":"العدد 1010₂ بالنظام العشري؟","options_ar":["٨","٩","١٠","١٢"],"explanation_ar":"مفتاح إجابة الاختبار: ٣ C — ٨+٢ = ١٠. (IT_Number_Systems.pdf، ص 36)"},{"id":"cse013-num-q4","subject_id":"cse013","lecture_id":"cse013-number-systems","prompt":"Which hex digits come after 9?","prompt_en":"","options":["G–L","A–F","0–5","X–Z"],"options_en":[],"correct":1,"explanation":"Quiz answer key: 4 B — A–F represent 10–15. (IT_Number_Systems.pdf, p. 36). Hexadecimal uses 16 symbols: 0–9 and A–F. (IT_Number_Systems.pdf, p. 15)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Original PDF quick quiz · IT_Number_Systems.pdf pp. 34–36"],"published":true,"prompt_ar":"أي أرقام ست عشرية تأتي بعد ٩؟","options_ar":["G–L","A–F","0–5","X–Z"],"explanation_ar":"مفتاح إجابة الاختبار: ٤ B — الرموز A–F تمثّل ١٠–١٥. (IT_Number_Systems.pdf، ص 36). الست عشري يستخدم ١٦ رمزًا: ٠–٩ ثم A–F."},{"id":"cse013-num-q5","subject_id":"cse013","lecture_id":"cse013-number-systems","prompt":"How many values can 7 bits represent?","prompt_en":"","options":["7","64","128","256"],"options_en":[],"correct":2,"explanation":"Quiz answer key: 5 C — 2⁷=128 values. (IT_Number_Systems.pdf, p. 36). Standard ASCII uses 7 bits, giving 128 values: 0–127. (IT_Number_Systems.pdf, p. 21)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Original PDF quick quiz · IT_Number_Systems.pdf pp. 34–36"],"published":true,"prompt_ar":"كم قيمة يمكن أن تمثّلها ٧ بتات؟","options_ar":["٧","٦٤","١٢٨","٢٥٦"],"explanation_ar":"مفتاح إجابة الاختبار: ٥ C — ٢⁷ = ١٢٨ قيمة. (IT_Number_Systems.pdf، ص 36). ASCII القياسي يستخدم ٧ بتات أي ١٢٨ قيمة."},{"id":"cse013-num-q6","subject_id":"cse013","lecture_id":"cse013-number-systems","prompt":"How many bits does standard ASCII use?","prompt_en":"","options":["4","7","8","16"],"options_en":[],"correct":1,"explanation":"Quiz answer key: 6 B — standard ASCII is 7-bit. (IT_Number_Systems.pdf, p. 36)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Original PDF quick quiz · IT_Number_Systems.pdf pp. 34–36"],"published":true,"prompt_ar":"كم بتًا يستخدم ASCII القياسي؟","options_ar":["٤","٧","٨","١٦"],"explanation_ar":"مفتاح إجابة الاختبار: ٦ B — ASCII القياسي بـ٧ بتات. (IT_Number_Systems.pdf، ص 36)"},{"id":"cse013-num-q7","subject_id":"cse013","lecture_id":"cse013-number-systems","prompt":"Which character is ASCII 65?","prompt_en":"","options":["a","A","0","Space"],"options_en":[],"correct":1,"explanation":"Quiz answer key: 7 B — ASCII 65 is A. (IT_Number_Systems.pdf, p. 36). A = 65; B = 66; Z = 90; a = 97. (IT_Number_Systems.pdf, p. 22)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Original PDF quick quiz · IT_Number_Systems.pdf pp. 34–36"],"published":true,"prompt_ar":"أي محرف هو ASCII 65؟","options_ar":["a","A","0","مسافة"],"explanation_ar":"مفتاح إجابة الاختبار: ٧ B — ASCII 65 هو الحرف A. (IT_Number_Systems.pdf، ص 36). A = ٦٥؛ B = ٦٦؛ Z = ٩٠؛ a = ٩٧."},{"id":"cse013-num-q8","subject_id":"cse013","lecture_id":"cse013-number-systems","prompt":"Which is a Unicode encoding?","prompt_en":"","options":["UTF-8","GHz","MIPS","OCR"],"options_en":[],"correct":0,"explanation":"Quiz answer key: 8 A — UTF-8 encodes Unicode text. (IT_Number_Systems.pdf, p. 36). UTF-8 is a widely used Unicode encoding. (IT_Number_Systems.pdf, p. 25)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags":["Original PDF quick quiz · IT_Number_Systems.pdf pp. 34–36"],"published":true,"prompt_ar":"أي مما يلي ترميز لـUnicode؟","options_ar":["UTF-8","GHz","MIPS","OCR"],"explanation_ar":"مفتاح إجابة الاختبار: ٨ A — UTF-8 يرمّز نصوص Unicode. (IT_Number_Systems.pdf، ص 36). UTF-8 ترميز شائع الاستخدام لـUnicode."},{"id":"cse013-num-q9","subject_id":"cse013","lecture_id":"cse013-number-systems","prompt":"1111₂ in decimal?","prompt_en":"","options":["7","8","14","15"],"options_en":[],"correct":3,"explanation":"Quiz answer key: 9 D — 8+4+2+1=15. (IT_Number_Systems.pdf, p. 36)","explanation_en":"","solution":"","solution_en":"","difficulty":"medium","tags"
